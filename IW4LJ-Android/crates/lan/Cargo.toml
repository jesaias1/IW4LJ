[package]
name = "lan"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "LAN play without a server: the host runs the relay in-process and announces it; a joiner finds it and forwards to it."

[dependencies]
iw4l-master = { path = "../iw4l-master" }
tokio = { version = "1.47", features = ["rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
