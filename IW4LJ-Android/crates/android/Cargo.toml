[package]
name = "iw4l-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Android entry: the cdylib Android loads, assembling the runtime for a device."

[lib]
name = "iw4l_android"
crate-type = ["cdylib"]

[dependencies]
bootstrap = { path = "../bootstrap" }
touch = { path = "../touch" }
lan = { path = "../lan" }
updater = { path = "../updater" }
asset_transport.workspace = true
jni = "0.22"
ndk-context = "0.1"
diag.workspace = true
sim.workspace = true
bevy.workspace = true
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }

[features]
# Development only: record large live allocations by call site (see
# `src/heap_probe.rs`).
heap-probe = []

[lints]
workspace = true

[package.metadata.android]
package = "dev.iw4j.iw4l"
apk_name = "iw4l"
build_targets = ["aarch64-linux-android"]
strip = "strip"

[package.metadata.android.sdk]
target_sdk_version = 34
min_sdk_version = 31

[package.metadata.android.application]
label = "IW4L"

[package.metadata.android.application.activity]
screen_orientation = "landscape"

# The `play` profile is a release build, so cargo-apk wants a real keystore.
# This is a local development key, not a store key; the file is git-ignored.
[package.metadata.android.signing.play]
path = "iw4l-dev.keystore"
keystore_password = "iw4l-dev-pass"
key_alias = "iw4l"
key_password = "iw4l-dev-pass"
