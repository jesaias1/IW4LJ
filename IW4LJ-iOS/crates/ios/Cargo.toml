[package]
name = "iw4l-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "iOS entry: resolves the app's folders, wires the phone's controller, text prompts and audio, and hands off to the shared mobile launch."

[lib]
name = "iw4l_ios"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "iw4lj"
path = "src/main.rs"

[dependencies]
mobile = { path = "../mobile" }
touch = { path = "../touch" }
diag.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
objc2-game-controller = "0.3"
objc2-avf-audio = "0.3"

[lints]
workspace = true
